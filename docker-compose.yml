services:
  db:
    image: mysql:8.0
    container_name: oficina-mysql
    restart: no
    environment:
      MYSQL_DATABASE: oficina
      MYSQL_ROOT_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - oficina-db-network

networks:
  oficina-db-network:
    name: oficina-db-network
    driver: bridge

volumes:
  mysql_data:
