name: Local Database CI/CD

on:
  pull_request:
    paths:
      - '.github/workflows/main.yml'
      - '.gitignore'
      - 'k8s/**'
      - 'kustomization.yaml'
      - 'schema.sql'
      - 'terraform/**'
  push:
    branches:
      - homolog
      - main
    paths:
      - '.github/workflows/main.yml'
      - '.gitignore'
      - 'k8s/**'
      - 'kustomization.yaml'
      - 'schema.sql'
      - 'terraform/**'
  workflow_dispatch:
    inputs:
      environment:
        description: Local target environment
        required: true
        type: choice
        options:
          - homolog
          - production

permissions:
  contents: read

jobs:
  validate:
    name: Format and validate Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout database repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize Terraform without a remote backend
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform -chdir=terraform validate

  plan:
    name: Plan database deployment
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout database repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Initialize and plan without changing a cluster
        env:
          TF_VAR_cluster_context: kind-oficina-homolog
        run: |
          terraform -chdir=terraform init -input=false -backend-config="path=$RUNNER_TEMP/oficina-db-plan.tfstate"
          terraform -chdir=terraform plan -input=false -lock=false -no-color

  deploy:
    name: Deploy database locally
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(fromJSON('["homolog", "main"]'), github.ref_name))
    needs: validate
    runs-on: [self-hosted, windows, x64, oficina-local]
    timeout-minutes: 20
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'homolog') }}
    concurrency:
      group: oficina-db-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
      cancel-in-progress: false
    env:
      TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'homolog') }}
    steps:
      - name: Checkout database repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Check target branch and prepare isolated state
        shell: pwsh
        run: |
          $expectedRef = if ($env:TARGET_ENV -eq 'production') { 'main' } else { 'homolog' }
          if ($env:GITHUB_REF_NAME -ne $expectedRef) {
            throw "Environment '$env:TARGET_ENV' requires database branch '$expectedRef'."
          }

          $stateDirectory = Join-Path $env:USERPROFILE '.terraform-state\oficina-db'
          New-Item -ItemType Directory -Path $stateDirectory -Force | Out-Null
          $statePath = Join-Path $stateDirectory "$($env:TARGET_ENV).tfstate"
          $clusterName = if ($env:TARGET_ENV -eq 'production') { 'oficina-prod' } else { 'oficina-homolog' }
          $environmentLines = @(
            "TF_STATE_PATH=$statePath",
            "TF_VAR_cluster_context=kind-$clusterName"
          ) -join "`n"
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "$environmentLines`n", [System.Text.UTF8Encoding]::new($false))

      - name: Initialize environment state
        shell: pwsh
        run: terraform -chdir=terraform init -input=false "-backend-config=path=$env:TF_STATE_PATH"

      - name: Apply database manifests and wait for MySQL
        shell: pwsh
        run: terraform -chdir=terraform apply -auto-approve -input=false

      - name: Show database outputs
        if: success()
        shell: pwsh
        run: terraform -chdir=terraform output
